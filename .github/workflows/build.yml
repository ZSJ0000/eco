name: Build Eco 2026.30

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Eco 2026.30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eco 2026.30 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Check current branch and commit
        shell: bash
        run: |
          set -e

          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse HEAD

          echo "Expected official Eco 2026.30 tag commit:"
          echo "01cc975a41874b60595402cc61cd85370f57c703"

      - name: Check repository version
        shell: bash
        run: |
          set -e

          if [ ! -f "gradle.properties" ]; then
            echo "ERROR: gradle.properties not found."
            exit 1
          fi

          echo "Version configuration:"
          grep -E '^[[:space:]]*version[[:space:]]*=' gradle.properties

          VERSION="$(grep -E '^[[:space:]]*version[[:space:]]*=' gradle.properties \
            | head -n 1 \
            | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')"

          if [ "$VERSION" != "2026.30" ]; then
            echo "ERROR: Expected version 2026.30, found: $VERSION"
            exit 1
          fi

          echo "Version check passed: $VERSION"

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Clean previous build
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Eco 2026.30
        shell: bash
        run: |
          ./gradlew build \
            --no-daemon \
            --stacktrace \
            --full-stacktrace

      - name: List generated JAR files
        shell: bash
        run: |
          set -e

          echo "Generated JAR files:"
          find . \
            -type f \
            -path "*/build/libs/*.jar" \
            -print \
            -exec ls -lh {} \;

      - name: Find Eco plugin JAR
        id: find_eco_jar
        shell: bash
        run: |
          set -e

          JAR="$(find . \
            -type f \
            -path "*/build/libs/*.jar" \
            -name "*all.jar" \
            | grep -v "/sources.jar$" \
            | grep -v "/javadoc.jar$" \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: Eco plugin JAR was not found."
            exit 1
          fi

          echo "Eco JAR:"
          echo "$JAR"

          {
            echo "jar<<EOF"
            echo "$JAR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Eco JAR
        shell: bash
        run: |
          set -e

          JAR="${{ steps.find_eco_jar.outputs.jar }}"

          echo "Validating:"
          echo "$JAR"

          unzip -t "$JAR" >/dev/null

          if ! unzip -Z1 "$JAR" | grep -qE '(^|/)plugin\.yml$'; then
            echo "ERROR: plugin.yml not found."
            exit 1
          fi

          echo
          echo "plugin.yml:"
          unzip -p "$JAR" plugin.yml

          echo
          echo "Checking plugin name..."
          if ! unzip -p "$JAR" plugin.yml | grep -q "^name: eco$"; then
            echo "ERROR: plugin name is not eco."
            exit 1
          fi

          echo
          echo "Checking plugin version..."
          if ! unzip -p "$JAR" plugin.yml | grep -q "^version: 2026.30$"; then
            echo "ERROR: plugin version is not 2026.30."
            exit 1
          fi

          echo
          echo "Checking main class..."
          if ! unzip -Z1 "$JAR" \
            | grep -q "^com/willfp/eco/internal/spigot/EcoImpl.class$"; then
            echo "ERROR: Eco main class not found."
            exit 1
          fi

          echo
          echo "Checking Eco API classes..."

          if unzip -Z1 "$JAR" \
            | grep -q "^com/willfp/eco/core/Eco.class$"; then
            echo "Found com/willfp/eco/core/Eco.class"
          else
            echo "WARNING: com/willfp/eco/core/Eco.class not included."
          fi

          if unzip -Z1 "$JAR" \
            | grep -q "^com/willfp/eco/core/EcoPlugin.class$"; then
            echo "Found com/willfp/eco/core/EcoPlugin.class"
          else
            echo "WARNING: com/willfp/eco/core/EcoPlugin.class not included."
          fi

          echo
          echo "Eco JAR validation passed."

      - name: Upload Eco 2026.30 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eco-2026.30-build-${{ github.run_number }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
